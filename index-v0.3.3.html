<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071a2c">
<title>XE ÔM ĐẠI CHIẾN v0.3.3</title>
<style>
html,body{margin:0;min-height:100%;background:#071a2c;color:#fff;font:16px system-ui;display:grid;place-items:center}
#status{max-width:360px;padding:24px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div id="status">Đang nạp bản vá RIDER & PASSENGER v0.3.3…</div>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  const response=await fetch(new URL('./index-v0.3.html',location.href),{cache:'no-store'});
  if(!response.ok)throw new Error('Không tải được index-v0.3.html (HTTP '+response.status+').');
  let source=await response.text();

  const riderPattern=/const driver=makePerson\(0x1686bd,0xffd447\);driver\.position\.set\(0,\.15,\.28\);playerRig\.add\(driver\);\s*const passenger=makePerson\(0xf06b8a,0x263e50\);passenger\.position\.set\(0,\.15,\.85\);passenger\.visible=false;playerRig\.add\(passenger\);/;
  if(!riderPattern.test(source))throw new Error('Không tìm thấy cụm mô hình tài xế/hành khách của bản v0.3.');
  source=source.replace(riderPattern,`
const driver=makePerson(0x1686bd,0xffd447);
driver.name='driver-rider';
driver.scale.set(.78,.78,.78);
driver.position.set(0,-.08,-.34);
playerRig.add(driver);

const passenger=makePerson(0xf06b8a,0x263e50);
passenger.name='rear-passenger';
passenger.scale.set(.70,.70,.70);
passenger.position.set(0,-.08,.66);
passenger.visible=false;
playerRig.add(passenger);
`);

  const cameraPattern=/let cameraMode=0;function setCameraMode\(\)\{[\s\S]*?\}\s*\/\/ traffic objects/;
  if(!cameraPattern.test(source))throw new Error('Không tìm thấy hàm chuyển camera của bản v0.3.');
  source=source.replace(cameraPattern,`
let cameraMode=0;
function setCameraMode(){
 cameraMode=(cameraMode+1)%2;
 bike.visible=cameraMode===0;
 playerRig.visible=cameraMode===1;
 $('cameraBtn').textContent=cameraMode===0?'CAM: 1P':'CAM: 3P';
 if(cameraMode===0){
  camera.position.set(0,2.15,5.3);
  camera.rotation.set(0,0,0,'YXZ');
 }else{
  camera.position.set(state.x*.45,4.15,13.5);
  camera.lookAt(state.x,1.15,4.2);
 }
}
// traffic objects`);

  const cameraStart='camera.position.x=THREE.MathUtils.damp(camera.position.x,state.x*.34,.9,dt);';
  const cameraEnd='camera.rotation.x=(Math.random()-.5)*shake*.22;';
  const a=source.indexOf(cameraStart);
  const b=source.indexOf(cameraEnd,a);
  if(a<0||b<0)throw new Error('Không tìm thấy đoạn cập nhật camera trong vòng lặp game.');
  const cameraUpdate=`playerRig.position.x=state.x;
playerRig.rotation.z=THREE.MathUtils.damp(playerRig.rotation.z,state.steer,5,dt);
if(cameraMode===0){
 camera.position.x=THREE.MathUtils.damp(camera.position.x,state.x*.34,.9,dt);
 camera.position.y=2.15+Math.sin(performance.now()*.012)*.025*(state.speed/17);
 camera.position.z=THREE.MathUtils.damp(camera.position.z,5.3,.9,dt);
 camera.rotation.z=THREE.MathUtils.damp(camera.rotation.z,(state.left?.075:0)+(state.right?-.075:0),4,dt);
 camera.rotation.x=0;
}else{
 camera.position.x=THREE.MathUtils.damp(camera.position.x,state.x*.45,.85,dt);
 camera.position.y=THREE.MathUtils.damp(camera.position.y,4.15,.85,dt);
 camera.position.z=THREE.MathUtils.damp(camera.position.z,13.5,.85,dt);
 camera.lookAt(state.x,1.15,4.2);
}
if(state.hitTimer>0)state.hitTimer=Math.max(0,state.hitTimer-dt);
const shake=state.hitTimer>0?state.hitTimer*.12:0;
if(cameraMode===0){
 camera.position.y+=(Math.random()-.5)*shake;
 camera.rotation.x=(Math.random()-.5)*shake*.22;
}else if(shake>0){
 camera.position.y+=(Math.random()-.5)*shake*.15;
}`;
  source=source.slice(0,a)+cameraUpdate+source.slice(b+cameraEnd.length);

  source=source.replace(
   'passenger.visible=false;cameraMode=0;bike.visible=true;',
   'passenger.visible=false;cameraMode=0;bike.visible=true;playerRig.visible=false;'
  );
  source=source.replace('CITY RIDER EXPERIENCE · v0.3','CITY RIDER EXPERIENCE · v0.3.3 RIDER & PASSENGER FIX');
  source=source.replace('v0.3 · Tài xế 3D · Hành khách · GPS · Bản đồ · Garage','v0.3.3 · Tài xế trước · Hành khách sau · Camera 1P/3P');
  source=source.replace('XE ÔM ĐẠI CHIẾN · v0.3 CITY RIDER EXPERIENCE','XE ÔM ĐẠI CHIẾN · v0.3.3 RIDER & PASSENGER FIX');
  source=source.replace('<title>XE ÔM ĐẠI CHIẾN v0.3</title>','<title>XE ÔM ĐẠI CHIẾN v0.3.3</title>');

  if(!source.includes("driver.name='driver-rider'")||
     !source.includes("passenger.name='rear-passenger'")||
     !source.includes('playerRig.visible=cameraMode===1')||
     !source.includes('CAM: 3P'))throw new Error('Kiểm tra sau khi vá không đạt.');

  document.open();
  document.write(source);
  document.close();
 }catch(error){
  status.textContent='Không thể áp dụng bản vá v0.3.3: '+error.message+' Hãy giữ index-v0.3.html trong cùng repository và kiểm tra lại sau.';
 }
})();
</script>
</body>
</html>
